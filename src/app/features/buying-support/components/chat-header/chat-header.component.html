<div
    class="flex items-center justify-between px-6 py-4 border-b bg-background/95 backdrop-blur supports-[backdrop-filter]:bg-background/60 z-10 sticky top-0 shadow-sm">
    <div class="flex items-center gap-3 overflow-hidden">
        <div class="flex items-center justify-center size-8 rounded-lg bg-primary/10 text-primary shrink-0">
            <lucide-icon name="message-square" class="size-4"></lucide-icon>
        </div>
        <div class="flex flex-col min-w-0">
            <h1 class="text-base font-semibold truncate leading-none">{{ title() }}</h1>
            <span class="text-xs text-muted-foreground truncate mt-1">Buying Support Assistant</span>
        </div>
    </div>

    <div class="flex items-center gap-1">
        <div>
            <hlm-tooltip>
                <button hlmTooltipTrigger aria-describedby="newChat" hlmBtn variant="ghost" position="below"
                    (click)="newChat.emit()"
                    class="text-muted-foreground hover:text-foreground hover:bg-muted transition-colors rounded-full cursor-pointer">
                    <lucide-icon name="plus" class="size-4"></lucide-icon>
                </button>
                <span *brnTooltipContent id="newChat" class="flex items-center gap-2">
                    Start New Chat
                </span>
            </hlm-tooltip>
        </div>

        <div>
            <hlm-tooltip>
                <button hlmTooltipTrigger aria-describedby="viewHistory" hlmBtn variant="ghost" position="below"
                    (click)="toggleHistory.emit()"
                    class="text-muted-foreground hover:text-foreground hover:bg-muted transition-colors rounded-full cursor-pointer">
                    <lucide-icon name="history" class="size-4"></lucide-icon>
                </button>
                <span *brnTooltipContent id="viewHistory" class="flex items-center gap-2">
                    View History
                </span>
            </hlm-tooltip>
        </div>


    </div>
</div>
