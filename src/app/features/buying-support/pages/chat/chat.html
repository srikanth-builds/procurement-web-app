<hlm-resizable-group direction="horizontal"
    class="h-full w-full overflow-hidden rounded-lg border bg-background shadow-sm">
    <!-- Chat Panel -->
    <hlm-resizable-panel [defaultSize]="70" [minSize]="30" class="relative flex flex-col h-full">
        <!-- Header -->
        <app-chat-header [title]="currentChatTitle()" (newChat)="startNewChat()" (toggleHistory)="toggleHistory()">
        </app-chat-header>

        <!-- History Modal -->
        <app-history [isOpen]="showHistoryModal()" [threads]="threads()" (close)="closeHistory()"
            (selectThread)="loadThread($event)" (updateTitle)="handleUpdateTitle($event)"
            (deleteThread)="handleDeleteThread($event)">
        </app-history>

        <!-- Conversation Stream -->
        <div class="flex-1 overflow-y-auto bg-muted/30 scroll-smooth" #scrollContainer>
            <div class="max-w-3xl mx-auto w-full h-full flex flex-col">
                <div class="flex-1 p-4 pb-32">
                    <app-conversation-stream [messages]="messages()" [activities]="activities()"
                        [thinkingSteps]="thinkingSteps()" [isLoading]="isLoading()" (addToPr)="handleAddToPr($event)"
                        (sendMessage)="handleSendMessage($event)"
                        (selectSupplier)="handleSelectSupplier($event)"></app-conversation-stream>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div
            class="absolute bottom-0 left-0 w-full z-20 bg-gradient-to-t from-background via-background/95 to-transparent pt-10 pb-6">
            <div class="max-w-3xl mx-auto px-4">
                <!-- Suggestions -->
                @if (suggestions() && suggestions()!.length > 0) {
                <div class="mb-2">
                    <app-suggestions [suggestions]="suggestions()!"
                        (suggestionSelected)="handleSuggestionSelected($event)">
                    </app-suggestions>
                </div>
                }

                <div class="relative flex items-center gap-2 rounded-2xl border bg-background shadow-lg ring-offset-background focus-within:ring-2 focus-within:ring-ring focus-within:ring-offset-2 p-2 transition-all duration-200"
                    [class.ring-2]="isLoading()" [class.ring-ring]="isLoading()" [class.ring-offset-2]="isLoading()">
                    <textarea [(ngModel)]="userInput"
                        (keydown.enter)="$event.preventDefault(); handleSendMessage(userInput())"
                        placeholder="Ask about procurement..." cdkTextareaAutosize cdkAutosizeMinRows="1"
                        cdkAutosizeMaxRows="5" [disabled]="isLoading()"
                        class="flex-1 resize-none bg-transparent px-3 py-2 text-sm placeholder:text-muted-foreground focus-visible:outline-none disabled:cursor-default max-h-40 overflow-y-auto leading-tight min-h-[40px]"></textarea>
                    <button (click)="handleSendMessage(userInput())" [disabled]="!userInput() || isLoading()"
                        class="inline-flex items-center justify-center whitespace-nowrap rounded-xl bg-primary h-10 w-10 text-primary-foreground shadow-sm hover:bg-primary/90 disabled:opacity-50 transition-all">
                        @if (isLoading()) {
                        <lucide-icon name="loader-2" class="size-5 animate-spin"></lucide-icon>
                        } @else {
                        <lucide-icon name="send-horizontal" class="size-5"></lucide-icon>
                        }
                    </button>
                </div>
                <div class="mt-2 text-center text-xs text-muted-foreground">
                    AI can make mistakes. Check important info.
                </div>
            </div>
        </div>
    </hlm-resizable-panel>

    <hlm-resizable-handle />

    <!-- PR Form Panel -->
    <hlm-resizable-panel [defaultSize]="30" [minSize]="20" class="h-full border-l bg-muted/5">
        <div class="h-full overflow-y-auto p-4">
            <app-purchase-requisition-form [prData]="state().purchaseRequisition" [artifacts]="state().artifacts"
                (removeItem)="handleRemoveItem($event)" (updateQuantity)="handleUpdateQuantity($event)"
                (updateDetails)="handleUpdatePrDetails($event)"
                (removeSupplier)="handleRemoveSupplier($event)"></app-purchase-requisition-form>
        </div>
    </hlm-resizable-panel>
</hlm-resizable-group>
